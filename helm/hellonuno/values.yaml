# Default values for hellonuno
# This is a YAML-formatted file.

# Global settings
global:
  namespace: hellonuno
  createNamespace: true  # ArgoCD will manage namespace creation

# Backend configuration
backend:
  name: hellonuno-backend
  replicaCount: 2

  image:
    repository: ghcr.io/nunosantos/hellonuno/backend
    tag: latest
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

  env:
    ASPNETCORE_ENVIRONMENT: Production

  probes:
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      path: /ready
      initialDelaySeconds: 5
      periodSeconds: 5

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

# Frontend configuration
frontend:
  name: hellonuno-frontend
  replicaCount: 2

  image:
    repository: ghcr.io/nunosantos/hellonuno/frontend
    tag: latest
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

  probes:
    liveness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      path: /
      initialDelaySeconds: 5
      periodSeconds: 5

  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  host: hellonuno.local
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# Service account
serviceAccount:
  create: true
  name: hellonuno-sa

# Image pull secrets for private GHCR images
# For public images, this is not required
imagePullSecrets: []
# To use private images, create a secret and uncomment:
# imagePullSecrets:
#   - name: ghcr-secret
