apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hellonuno-prod

namePrefix: prod-

resources:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment

  - patch: |-
      - op: replace
        path: /metadata/name
        value: hellonuno-prod
    target:
      kind: Namespace

  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
    target:
      kind: Deployment
      name: hellonuno-backend

commonLabels:
  environment: production
